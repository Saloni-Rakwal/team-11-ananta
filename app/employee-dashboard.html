<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ECOGUARD · Employee Controls</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #F6F4EE;
      --paper: rgba(252, 251, 247, 0.91);
      --ink: #0F2A20;
      --muted: #4A5D55;
      --line: rgba(15, 42, 32, 0.15);
      --forest: #0F2A20;
      --forest-2: #194233;
      --amber: #C87D20;
      --amber-soft: rgba(200, 125, 32, 0.14);
      --ok-bg: rgba(25, 115, 65, 0.14);
      --ok-ink: #166534;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
      color: var(--ink);
      background-color: var(--bg);
      background-image:
        linear-gradient(to right, rgba(15, 42, 32, 0.04) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(15, 42, 32, 0.04) 1px, transparent 1px);
      background-size: 28px 28px;
      padding-bottom: 40px;
      position: relative;
      overflow-x: hidden;
    }

    /* Large Centered Background Plant + Smart Socket Animation */
    .bg-eco-layer {
      position: fixed;
      top: 54%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: min(86vw, 560px);
      height: auto;
      z-index: 0;
      pointer-events: none;
      opacity: 0.34;
    }

    .plant-stem {
      transform-origin: 54px 92px;
      animation: gentleSway 3.6s ease-in-out infinite;
    }

    .leaf-left {
      transform-origin: 54px 62px;
      animation: leafBreathe 3.2s ease-in-out infinite;
    }

    .leaf-right {
      transform-origin: 54px 50px;
      animation: leafBreathe 3.2s ease-in-out 0.6s infinite;
    }

    .energy-pulse {
      stroke-dasharray: 12 44;
      animation: flowCurrent 2s linear infinite;
    }

    .socket-led {
      animation: ledBlink 2s ease-in-out infinite;
    }

    @keyframes gentleSway {
      0%, 100% { transform: rotate(-2.5deg); }
      50% { transform: rotate(2.5deg); }
    }

    @keyframes leafBreathe {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }

    @keyframes flowCurrent {
      from { stroke-dashoffset: 56; }
      to { stroke-dashoffset: 0; }
    }

    @keyframes ledBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    @media (prefers-reduced-motion: reduce) {
      .plant-stem, .leaf-left, .leaf-right, .energy-pulse, .socket-led {
        animation: none;
      }
    }

    .topbar {
      position: relative;
      z-index: 1;
      background: var(--forest);
      color: #F6F4EE;
      padding: 14px 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 3px solid var(--amber);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-name {
      font-family: "Space Grotesk", sans-serif;
      font-size: 19px;
      font-weight: 700;
      letter-spacing: 0.12em;
    }

    .brand-sub {
      font-family: "JetBrains Mono", monospace;
      font-size: 11px;
      color: #D8E2DC;
      letter-spacing: 0.06em;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .role-pill {
      font-family: "JetBrains Mono", monospace;
      font-size: 11px;
      text-transform: uppercase;
      padding: 5px 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      color: #F6F4EE;
    }

    .btn-logout {
      padding: 7px 12px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.28);
      background: transparent;
      color: #F6F4EE;
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }

    .btn-logout:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 1040px;
      margin: 24px auto 0;
      padding: 0 16px;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }

    .toolbar h1 {
      margin: 0;
      font-family: "Space Grotesk", sans-serif;
      font-size: 22px;
    }

    .toolbar p {
      margin: 3px 0 0;
      font-size: 13.5px;
      color: var(--muted);
    }

    select {
      padding: 9px 12px;
      border-radius: 9px;
      border: 1px solid var(--line);
      background: #FCFBF7;
      color: var(--ink);
      font-family: inherit;
      font-size: 14px;
      font-weight: 500;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
      gap: 16px;
    }

    .zone-card {
      background: var(--paper);
      backdrop-filter: blur(4px);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 18px;
      box-shadow: 0 8px 22px rgba(15, 42, 32, 0.06);
    }

    .zone-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--line);
    }

    .zone-title {
      font-family: "Space Grotesk", sans-serif;
      font-size: 17px;
      font-weight: 700;
      margin: 0;
    }

    .zone-code {
      font-family: "JetBrains Mono", monospace;
      font-size: 11px;
      color: var(--muted);
    }

    .group-heading {
      margin: 12px 0 4px;
      font-family: "JetBrains Mono", monospace;
      font-size: 10.5px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
    }

    .device-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px dashed rgba(15, 42, 32, 0.12);
    }

    .device-row:last-of-type {
      border-bottom: 0;
    }

    .device-label {
      font-size: 14px;
      font-weight: 500;
    }

    .switch-btn {
      min-width: 62px;
      padding: 5px 11px;
      border-radius: 8px;
      border: 1px solid var(--line);
      font-family: "JetBrains Mono", monospace;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .switch-btn.on {
      background: var(--ok-bg);
      color: var(--ok-ink);
      border-color: rgba(22, 101, 52, 0.28);
    }

    .switch-btn.off {
      background: #EFECE4;
      color: var(--muted);
    }

    .ac-temp-box {
      margin-top: 8px;
      padding: 10px 12px;
      border-radius: 9px;
      background: rgba(246, 244, 238, 0.85);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .ac-temp-label {
      font-size: 13px;
      color: var(--muted);
    }

    .temp-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .temp-btn {
      width: 30px;
      height: 30px;
      border-radius: 7px;
      border: 1px solid var(--line);
      background: #FCFBF7;
      color: var(--ink);
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    .temp-val {
      font-family: "JetBrains Mono", monospace;
      font-size: 14px;
      font-weight: 600;
      min-width: 44px;
      text-align: center;
    }

    .tip {
      margin-top: 10px;
      font-size: 12px;
      color: var(--amber);
      font-weight: 500;
    }
  </style>
</head>
<body>
  <svg class="bg-eco-layer" viewBox="0 0 220 124" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <!-- Smart Wall Socket (Right Side) -->
    <rect x="134" y="24" width="60" height="68" rx="10" fill="#143d2b" stroke="#0f2a20" stroke-width="2.5"/>
    <circle cx="164" cy="44" r="3.8" fill="#d97706"/>
    <circle cx="152" cy="63" r="3.8" fill="#1f5c41"/>
    <circle cx="176" cy="63" r="3.8" fill="#1f5c41"/>
    <circle class="socket-led" cx="164" cy="80" r="3.4" fill="#16a34a"/>

    <!-- Connecting Eco-Cord from Socket to Planter Pot -->
    <path d="M134 63 C110 63, 110 92, 78 92" stroke="#1f5c41" stroke-width="4" stroke-linecap="round"/>
    <path class="energy-pulse" d="M134 63 C110 63, 110 92, 78 92" stroke="#d97706" stroke-width="4" stroke-linecap="round"/>

    <!-- Planter Pot (Left Side) -->
    <path d="M30 80 H78 L71.5 108 C70.8 110.6 68.5 112.4 65.8 112.4 H42.2 C39.5 112.4 37.2 110.6 36.5 108 L30 80 Z" fill="#d97706"/>
    <rect x="26" y="75" width="56" height="8" rx="3.5" fill="#b45309"/>

    <!-- Growing Plant Sprout -->
    <g class="plant-stem">
      <path d="M54 75 C54 57, 54 43, 54 27" stroke="#1f5c41" stroke-width="4" stroke-linecap="round"/>
      <path class="leaf-left" d="M54 57 C35 57, 25 43, 28.5 31 C40.5 31, 52.3 41.5, 54 57 Z" fill="#16a34a"/>
      <path class="leaf-right" d="M54 46 C73 46, 83 32, 79.5 20 C67.5 20, 55.7 30.5, 54 46 Z" fill="#22c55e"/>
      <circle cx="54" cy="22" r="4.2" fill="#d97706"/>
    </g>
  </svg>

  <header class="topbar">
    <div class="brand">
      <div>
        <div class="brand-name">ECOGUARD</div>
        <div class="brand-sub">POWER · WATER · WALLS · EMPLOYEE CONSOLE</div>
      </div>
    </div>
    <div class="top-actions">
      <span id="roleBadge" class="role-pill">Employee View</span>
      <button id="logoutBtn" class="btn-logout" type="button">Sign Out</button>
    </div>
  </header>

  <main class="container">
    <div class="toolbar">
      <div>
        <h1>Room Comfort &amp; Lighting</h1>
        <p>Toggle Light 1–3, Fan 1–3, and AC units or adjust temperature setpoints (recommended AC: 24 °C).</p>
      </div>
      <select id="floorFilter" aria-label="Filter by floor">
        <option value="ALL">All Floors</option>
        <option value="F0">Ground Floor (F0)</option>
        <option value="F1">First Floor (F1)</option>
      </select>
    </div>

    <div id="zonesGrid" class="grid"></div>
  </main>

  <script>
    const role = sessionStorage.getItem("role");
    if (!role) {
      window.location.href = "index.html";
    }
    document.getElementById("roleBadge").textContent =
      role === "admin" ? "Admin Preview · Employee View" : "Employee · Lights, Fans & AC";

    const state = [
      {
        id: "r1", floor: "F0", code: "F0 · RM-101", name: "Lecture Hall A",
        lights: [true, true, false], fans: [true, true, false], ac: true, temp: 24
      },
      {
        id: "r2", floor: "F0", code: "F0 · RM-102", name: "Faculty Lounge",
        lights: [true, false, false], fans: [false, false, false], ac: true, temp: 22
      },
      {
        id: "r3", floor: "F1", code: "F1 · RM-201", name: "Seminar Room 1",
        lights: [false, false, false], fans: [true, false, false], ac: false, temp: 24
      },
      {
        id: "r4", floor: "F1", code: "F1 · LAB-204", name: "Computing Lab",
        lights: [true, true, true], fans: [true, true, true], ac: true, temp: 23
      }
    ];

    function renderSwitchRow(label, isOn, action, indexAttr) {
      return (
        '<div class="device-row">' +
          '<span class="device-label">' + label + '</span>' +
          '<button type="button" class="switch-btn ' + (isOn ? "on" : "off") + '" data-action="' + action + '" ' + (indexAttr || "") + '>' +
            (isOn ? "ON" : "OFF") +
          '</button>' +
        '</div>'
      );
    }

    function render() {
      const selectedFloor = document.getElementById("floorFilter").value;
      const grid = document.getElementById("zonesGrid");
      const visibleRooms = state.filter(function (z) {
        return selectedFloor === "ALL" || z.floor === selectedFloor;
      });

      grid.innerHTML = visibleRooms
        .map(function (room) {
          const lightsHtml = room.lights
            .map(function (isOn, idx) {
              return renderSwitchRow("Light " + (idx + 1), isOn, "light", 'data-index="' + idx + '"');
            })
            .join("");

          const fansHtml = room.fans
            .map(function (isOn, idx) {
              return renderSwitchRow("Fan " + (idx + 1), isOn, "fan", 'data-index="' + idx + '"');
            })
            .join("");

          const tipHtml =
            room.ac && room.temp < 24
              ? '<div class="tip">Below 24 °C — raising to 24 °C trims excess AC load.</div>'
              : "";

          return (
            '<section class="zone-card" data-id="' + room.id + '">' +
              '<div class="zone-header">' +
                '<h2 class="zone-title">' + room.name + '</h2>' +
                '<span class="zone-code">' + room.code + '</span>' +
              '</div>' +
              '<div class="group-heading">Lights</div>' +
              lightsHtml +
              '<div class="group-heading">Fans</div>' +
              fansHtml +
              '<div class="group-heading">AC &amp; Temperature Control</div>' +
              renderSwitchRow("Air Conditioner", room.ac, "ac", "") +
              '<div class="ac-temp-box">' +
                '<span class="ac-temp-label">Temp (' + (room.ac ? "Active" : "Standby") + ')</span>' +
                '<div class="temp-controls">' +
                  '<button type="button" class="temp-btn" data-action="temp-down" aria-label="Decrease temperature">−</button>' +
                  '<span class="temp-val">' + room.temp + ' °C</span>' +
                  '<button type="button" class="temp-btn" data-action="temp-up" aria-label="Increase temperature">+</button>' +
                '</div>' +
              '</div>' +
              tipHtml +
            '</section>'
          );
        })
        .join("");
    }

    document.getElementById("zonesGrid").addEventListener("click", function (e) {
      const btn = e.target.closest("button[data-action]");
      if (!btn) return;
      const card = e.target.closest(".zone-card");
      const room = state.find(function (r) {
        return r.id === card.dataset.id;
      });
      if (!room) return;

      const action = btn.dataset.action;
      const idx = Number(btn.dataset.index);

      if (action === "light") room.lights[idx] = !room.lights[idx];
      if (action === "fan") room.fans[idx] = !room.fans[idx];
      if (action === "ac") room.ac = !room.ac;
      if (action === "temp-down") {
        room.ac = true;
        room.temp = Math.max(18, room.temp - 1);
      }
      if (action === "temp-up") {
        room.ac = true;
        room.temp = Math.min(28, room.temp + 1);
      }
      render();
    });

    document.getElementById("floorFilter").addEventListener("change", render);

    document.getElementById("logoutBtn").addEventListener("click", function () {
      sessionStorage.removeItem("role");
      window.location.href = "index.html";
    });

    render();
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ECOGUARD · Employee Controls</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #F6F4EE;
      --paper: #FCFBF7;
      --ink: #0F2A20;
      --muted: #4A5D55;
      --line: rgba(15, 42, 32, 0.15);
      --forest: #0F2A20;
      --forest-2: #194233;
      --amber: #C87D20;
      --amber-soft: rgba(200, 125, 32, 0.14);
      --ok-bg: rgba(25, 115, 65, 0.12);
      --ok-ink: #166534;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
      color: var(--ink);
      background-color: var(--bg);
      background-image:
        linear-gradient(to right, rgba(15, 42, 32, 0.04) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(15, 42, 32, 0.04) 1px, transparent 1px);
      background-size: 28px 28px;
      padding-bottom: 40px;
      position: relative;
      overflow-x: hidden;
    }

    /* Subtle Background Plant + Smart Socket Animation */
    .bg-eco-layer {
      position: fixed;
      right: 24px;
      bottom: 18px;
      width: 240px;
      height: 136px;
      z-index: 0;
      pointer-events: none;
      opacity: 0.24;
    }

    .plant-stem {
      transform-origin: 54px 92px;
      animation: gentleSway 3.6s ease-in-out infinite;
    }

    .leaf-left {
      transform-origin: 54px 62px;
      animation: leafBreathe 3.2s ease-in-out infinite;
    }

    .leaf-right {
      transform-origin: 54px 50px;
      animation: leafBreathe 3.2s ease-in-out 0.6s infinite;
    }

    .energy-pulse {
      stroke-dasharray: 10 46;
      animation: flowCurrent 2.2s linear infinite;
    }

    .socket-led {
      animation: ledBlink 2.2s ease-in-out infinite;
    }

    @keyframes gentleSway {
      0%, 100% { transform: rotate(-2.5deg); }
      50% { transform: rotate(2.5deg); }
    }

    @keyframes leafBreathe {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }

    @keyframes flowCurrent {
      from { stroke-dashoffset: 56; }
      to { stroke-dashoffset: 0; }
    }

    @keyframes ledBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }

    @media (prefers-reduced-motion: reduce) {
      .plant-stem, .leaf-left, .leaf-right, .energy-pulse, .socket-led {
        animation: none;
      }
    }

    .topbar {
      position: relative;
      z-index: 1;
      background: var(--forest);
      color: #F6F4EE;
      padding: 14px 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 3px solid var(--amber);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-name {
      font-family: "Space Grotesk", sans-serif;
      font-size: 19px;
      font-weight: 700;
      letter-spacing: 0.12em;
    }

    .brand-sub {
      font-family: "JetBrains Mono", monospace;
      font-size: 11px;
      color: #D8E2DC;
      letter-spacing: 0.06em;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .role-pill {
      font-family: "JetBrains Mono", monospace;
      font-size: 11px;
      text-transform: uppercase;
      padding: 5px 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      color: #F6F4EE;
    }

    .btn-logout {
      padding: 7px 12px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.28);
      background: transparent;
      color: #F6F4EE;
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }

    .btn-logout:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 1040px;
      margin: 24px auto 0;
      padding: 0 16px;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }

    .toolbar h1 {
      margin: 0;
      font-family: "Space Grotesk", sans-serif;
      font-size: 22px;
    }

    .toolbar p {
      margin: 3px 0 0;
      font-size: 13.5px;
      color: var(--muted);
    }

    select {
      padding: 9px 12px;
      border-radius: 9px;
      border: 1px solid var(--line);
      background: var(--paper);
      color: var(--ink);
      font-family: inherit;
      font-size: 14px;
      font-weight: 500;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
      gap: 16px;
    }

    .zone-card {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 18px;
      box-shadow: 0 8px 22px rgba(15, 42, 32, 0.05);
    }

    .zone-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--line);
    }

    .zone-title {
      font-family: "Space Grotesk", sans-serif;
      font-size: 17px;
      font-weight: 700;
      margin: 0;
    }

    .zone-code {
      font-family: "JetBrains Mono", monospace;
      font-size: 11px;
      color: var(--muted);
    }

    .group-heading {
      margin: 12px 0 4px;
      font-family: "JetBrains Mono", monospace;
      font-size: 10.5px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
    }

    .device-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px dashed rgba(15, 42, 32, 0.12);
    }

    .device-row:last-of-type {
      border-bottom: 0;
    }

    .device-label {
      font-size: 14px;
      font-weight: 500;
    }

    .switch-btn {
      min-width: 62px;
      padding: 5px 11px;
      border-radius: 8px;
      border: 1px solid var(--line);
      font-family: "JetBrains Mono", monospace;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .switch-btn.on {
      background: var(--ok-bg);
      color: var(--ok-ink);
      border-color: rgba(22, 101, 52, 0.28);
    }

    .switch-btn.off {
      background: #EFECE4;
      color: var(--muted);
    }

    .ac-temp-box {
      margin-top: 8px;
      padding: 10px 12px;
      border-radius: 9px;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .ac-temp-label {
      font-size: 13px;
      color: var(--muted);
    }

    .temp-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .temp-btn {
      width: 30px;
      height: 30px;
      border-radius: 7px;
      border: 1px solid var(--line);
      background: var(--paper);
      color: var(--ink);
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    .temp-val {
      font-family: "JetBrains Mono", monospace;
      font-size: 14px;
      font-weight: 600;
      min-width: 44px;
      text-align: center;
    }

    .tip {
      margin-top: 10px;
      font-size: 12px;
      color: var(--amber);
      font-weight: 500;
    }
  </style>
</head>
<body>

    <path d="M134 63 C110 63, 110 92, 78 92" stroke="#1f5c41" stroke-width="4" stroke-linecap="round"/>

      <path d="M54 75 C54 57, 54 43, 54 27" stroke="#1f5c41" stroke-width="4" stroke-linecap="round"/>

  <header class="topbar">
    <div class="brand">
      <div>
        <div class="brand-name">ECOGUARD</div>

    </div>
    <div class="top-actions">
      <span id="roleBadge" class="role-pill">Employee View</span>
      <button id="logoutBtn" class="btn-logout" type="button">Sign Out</button>
    </div>
  </header>

  <main class="container">
    <div class="toolbar">
      <div>
        <h1>Room Comfort &amp; Lighting</h1>
        <p>Toggle Light 1–3, Fan 1–3, and AC units or adjust temperature setpoints (recommended AC: 24 °C).</
